<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Real-time Location Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GPS Location Tracker</h1>
            <div class="status" id="status">Waiting for GPS data...</div>
        </header>
        
        <div class="controls">
            <button id="clearMarkersBtn">Clear All Markers</button>
            <button id="centerMapBtn">Center on Latest</button>
            <div class="info">
                <span id="markerCount">Markers: 0</span>
                <span id="lastUpdate">Last update: Never</span>
            </div>
        </div>
        
        <div id="map"></div>
        
        <div class="coordinates-panel">
            <h3>Recent Coordinates</h3>
            <div id="coordinatesList"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script async defer 
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
</body>
</html>
